# ===== Test configuration =====
# Substitui POR COMPLETO o application.properties de producao durante os testes,
# por isso tem de incluir tudo o que os beans precisam.

# --- App ---
app.base-url=http://localhost:8080

# --- Base de dados: H2 em memoria (NUNCA a de producao em ./data/) ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# --- Providers externos desligados (testes hermeticos, sem rede) ---
app.discover.ticketmaster.api-key=
app.discover.ticketmaster.country-code=PT
app.discover.seatgeek.client-id=
app.discover.ticketmaster.base-url=http://localhost:0
app.discover.seatgeek.base-url=http://localhost:0
app.discover.agendalx.base-url=http://localhost:0

logging.level.org.springframework.web=DEBUG