name: CI

# Corre toda a suite de testes em cada push e pull request para a main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & test (JDK 17)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # O runner ubuntu-latest já traz o Google Chrome instalado, e o Selenium
      # Manager (Selenium 4) descarrega o chromedriver compatível em runtime, por
      # isso o SeleniumEndToEndTest corre headless sem configuração extra. Este
      # passo serve só de sanity-check de que o Chrome está presente.
      # (Se um dia a imagem do runner deixar de trazer o Chrome, acrescenta antes
      #  deste passo:  - uses: browser-actions/setup-chrome@v1)
      - name: Show Chrome version
        run: google-chrome --version

      - name: Build and run all tests
        run: mvn -B verify

      # Disponibiliza os relatórios do Surefire mesmo quando os testes falham,
      # para se poder inspecionar o que rebentou diretamente na execução do CI.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
